name: Build patched LavaSrc JAR

on:
  push:
    branches: [ 'fix/ytdlp-403-4.8.3' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            11
            17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: ./gradlew :plugin:jar --no-daemon
      - name: Prepare patched JAR
        run: |
          mkdir -p dist
          jar_path=$(find plugin/build/libs -maxdepth 1 -name 'lavasrc-plugin-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
          test -n "$jar_path"
          cp "$jar_path" dist/lavasrc-plugin-4.8.3-ytdlp-fix.jar
          jar tf dist/lavasrc-plugin-4.8.3-ytdlp-fix.jar > dist/jar-contents.txt
          grep -q 'com/github/topi314/lavasrc/ytdlp/YtdlpAudioTrack.class' dist/jar-contents.txt
          rm dist/jar-contents.txt
          cd dist
          sha256sum lavasrc-plugin-4.8.3-ytdlp-fix.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LavaSrc-4.8.3-ytdlp-fix
          path: dist/
          if-no-files-found: error
